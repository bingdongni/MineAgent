# ServerPlayer constructs its vanilla gameMode as a final field. MineAgent must
# replace it with FakePlayerGameMode so fake companions use the same block
# interaction lifecycle as real players. Fabric applies the equivalent rule in
# mineagent.accesswidener; NeoForge needs this Access Transformer at compile and
# runtime or the shared FakePlayerFactory cannot be built safely.
public-f net.minecraft.server.level.ServerPlayer gameMode
