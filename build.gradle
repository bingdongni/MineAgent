plugins {
    id 'java-library'
    id 'maven-publish'
}

group = providers.gradleProperty('group').get()
version = providers.gradleProperty('mod_version').get()

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    // Minecraft dependencies
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
}

// Shared Minecraft version
def minecraft_version = '1.21.1'

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = rootProject.group
    version = rootProject.version

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    repositories {
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
    }

    dependencies {
        // Gson for JSON handling (bundled with Minecraft)
        // Note: NeoForge provides its own gson, so we exclude the explicit dependency
        // for the neoforge subproject to avoid version conflicts
        if (project.name != 'neoforge') {
            compileOnly 'com.google.code.gson:gson:2.11.0'
        }

        // JUnit for testing
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }

    // Binary distributions must carry the exact license text. Keeping it in
    // META-INF also prevents it from colliding with dependency license files.
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) {
            into 'META-INF'
            rename { 'LICENSE_MineAgent' }
        }
    }

    test {
        useJUnitPlatform()
    }
}

// API module — pure Java, no Minecraft dependency
project(':api') {
    dependencies {
        compileOnly 'com.google.code.gson:gson:2.11.0'
    }
}

// Engine module — depends on API + Minecraft
project(':engine') {
    dependencies {
        implementation project(':api')
        // Minecraft server (provided at runtime)
        compileOnly "net.neoforged:neoforge:${project.property('neoforge_version')}"
    }
}

// Tools module — depends on API + Engine
project(':tools') {
    dependencies {
        implementation project(':api')
        implementation project(':engine')
        // Minecraft server (provided at runtime)
        compileOnly "net.neoforged:neoforge:${project.property('neoforge_version')}"
    }
}

// Keep tag, release prose, loader metadata and the selected artifacts in one contract.
tasks.register('verifyReleaseTag') {
    doLast {
        def actual = providers.gradleProperty('release_tag').orNull
        def expected = "v${project.version}"
        if (actual != expected) throw new GradleException("Release tag '${actual}' must equal '${expected}' from gradle.properties")
    }
}

tasks.register('prepareReleaseNotes') {
    def template = rootProject.file('.github/release-notes.md')
    def destination = layout.buildDirectory.file('release-notes.md')
    inputs.file(template)
    inputs.property('releaseVersion', project.version.toString())
    outputs.file(destination)
    doLast {
        def source = template.getText('UTF-8')
        if (!source.contains('@VERSION@')) throw new GradleException('Release notes must contain the @VERSION@ placeholder')
        def output = destination.get().asFile
        output.parentFile.mkdirs()
        output.setText(source.replace('@VERSION@', project.version.toString()), 'UTF-8')
    }
}

def verifyNativeReport = { File report, List<String> required ->
    if (!report.isFile()) throw new GradleException("Missing native Minecraft GameTest report: ${report}")
    def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
    factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
    factory.setFeature('http://xml.org/sax/features/external-general-entities', false)
    factory.setFeature('http://xml.org/sax/features/external-parameter-entities', false)
    def document = factory.newDocumentBuilder().parse(report)
    ['failure', 'error', 'skipped'].each { name ->
        if (document.getElementsByTagName(name).length > 0)
            throw new GradleException("Native Minecraft GameTests contain ${name} results")
    }
    def cases = document.getElementsByTagName('testcase')
    def names = (0..<cases.length).collect { cases.item(it).getAttribute('name') }.toSet()
    required.each { name ->
        if (!names.contains(name)) throw new GradleException("Missing required native scenario in ${report}: ${name}")
    }
    logger.lifecycle("Verified ${cases.length} native Minecraft GameTests in ${report.parentFile.parentFile.name}")
}

def lifecycleCases = ['playerlifecyclegametests.createsremovesandrecreatesthesameprofile',
                      'playerlifecyclegametests.duplicatecreationpreservestheexistingplayer',
                      'playerlifecyclegametests.failedentityregistrationrollsbackonlythenewplayer']

tasks.register('verifyGameTests') {
    dependsOn ':fabric:runGametest'
    doLast {
        verifyNativeReport(rootProject.file('fabric/build/gametest-results.xml'),
                ['learninggametests.learnstransfersandstopsafterrulechange',
                 'learninggametests.observespublicactorandrejectswronguuid',
                 'learninggametests.observesnewitemwithoutdumpingprivatecomponents',
                 'learninggametests.runsobservationsviatheagentloopandreadspublicstorage',
                 'learninggametests.nativedatareloadinvalidateslearnedrules'] + lifecycleCases)
    }
}

tasks.register('verifyNeoForgeGameTests') {
    dependsOn ':neoforge:runGameTestServer'
    doLast {
        verifyNativeReport(rootProject.file('neoforge/build/gametest-results.xml'), lifecycleCases)
    }
}

tasks.register('verifyReleaseArtifacts') {
    dependsOn ':fabric:build', ':neoforge:build', 'verifyGameTests', 'verifyNeoForgeGameTests'
    def loaders = ['fabric', 'neoforge']
    def artifacts = loaders.collect { rootProject.file("${it}/build/libs/mineagent-${it}-${project.version}.jar") }
    def manifest = layout.buildDirectory.file('release-artifacts.sha256')
    inputs.files(artifacts)
    inputs.property('releaseVersion', project.version.toString())
    outputs.file(manifest)
    doLast {
        def checksums = []
        artifacts.eachWithIndex { artifact, index ->
            if (!artifact.isFile()) throw new GradleException("Missing release artifact: ${artifact}")
            new java.util.zip.ZipFile(artifact).withCloseable { archive ->
                ['com/mineagent/api/llm/provider/LLMProvider.class',
                 'com/mineagent/api/platform/CapabilityObservation.class',
                 'com/mineagent/api/platform/PortTransferResult.class',
                 'com/mineagent/engine/exploration/PredictiveLearning.class',
                 'com/mineagent/engine/exploration/LearningConditions.class',
                 'com/mineagent/engine/exploration/ActorObservation.class',
                 'com/mineagent/engine/cache/ExperienceContext.class',
                 'com/mineagent/engine/llm/CachePrefixPolicy.class',
                 'com/mineagent/engine/cognition/TeamWorkBoard.class',
                 'com/mineagent/engine/memory/TaskEpisodeMemory.class',
                 'com/mineagent/engine/planning/ExperienceRepairPlanner.class',
                 'com/mineagent/engine/planning/PlanGraph.class',
                 'com/mineagent/engine/skill/SkillBindings.class',
                 'com/mineagent/tools/perception/InspectEntityTool.class',
                 'com/mineagent/tools/perception/InspectItemTool.class',
                 'com/mineagent/tools/inventory/TransferPortTool.class',
                 'META-INF/LICENSE_MineAgent'].each { path ->
                    if (archive.getEntry(path) == null) throw new GradleException("${artifact.name} is missing ${path}")
                }
                if (archive.entries().toList().any { entry ->
                    ['com/mineagent/gametest/', 'com/mineagent/neoforge/gametest/',
                     'data/mineagent_lifecycle_tests/', 'com/mineagent/modtest/', 'techreborn/', 'reborncore/', 'vectorwing/farmersdelight/',
                     'com/mattidragon/extendeddrawers/'].any { prefix -> entry.name.startsWith(prefix) }
                }) throw new GradleException("Real-mod test classes or third-party code leaked into ${artifact.name}")
                def metadata = loaders[index] == 'fabric' ? 'fabric.mod.json' : 'META-INF/neoforge.mods.toml'
                def entry = archive.getEntry(metadata)
                if (entry == null) throw new GradleException("Missing loader metadata in ${artifact.name}")
                def source = archive.getInputStream(entry).withCloseable { it.getText('UTF-8') }
                if (source.contains('${version}')) throw new GradleException("Unexpanded version in ${artifact.name}")
                if (loaders[index] == 'fabric') {
                    def parsed = new groovy.json.JsonSlurper().parseText(source)
                    if (parsed.id != 'mineagent' || parsed.version != project.version.toString()) {
                        throw new GradleException("Wrong Fabric identity/version in ${artifact.name}")
                    }
                } else {
                    def normalized = source.replace(' ', '').replace('\t', '')
                    if (!normalized.contains('modId="mineagent"')
                            || !normalized.contains('version="' + project.version + '"')) {
                        throw new GradleException("Wrong NeoForge identity/version in ${artifact.name}")
                    }
                }
            }
            def hash = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
            checksums.add("${hash}  ${artifact.name}")
        }
        def output = manifest.get().asFile
        output.parentFile.mkdirs()
        output.setText(checksums.join('\n') + '\n', 'UTF-8')
    }
}
