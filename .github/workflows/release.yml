name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish both loaders
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build both loader artifacts
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean :fabric:build :neoforge:build

      - name: Verify release JARs
        run: |
          find fabric/build/libs -maxdepth 1 -name 'mineagent-fabric-*.jar' ! -name '*-sources.jar' | grep -q .
          find neoforge/build/libs -maxdepth 1 -name 'mineagent-neoforge-*.jar' ! -name '*-sources.jar' | grep -q .

      - name: Create prerelease with Fabric and NeoForge JARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FABRIC_JAR="$(find fabric/build/libs -maxdepth 1 -name 'mineagent-fabric-*.jar' ! -name '*-sources.jar' -print -quit)"
          NEOFORGE_JAR="$(find neoforge/build/libs -maxdepth 1 -name 'mineagent-neoforge-*.jar' ! -name '*-sources.jar' -print -quit)"
          gh release create "$GITHUB_REF_NAME" \
            "$FABRIC_JAR" \
            "$NEOFORGE_JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MineAgent $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --prerelease
