name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish both loaders
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build both loader artifacts
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean verifyReleaseTag prepareReleaseNotes verifyReleaseArtifacts "-Prelease_tag=$GITHUB_REF_NAME"

      - name: Publish release with Fabric and NeoForge JARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FABRIC_JAR="fabric/build/libs/mineagent-fabric-$VERSION.jar"
          NEOFORGE_JAR="neoforge/build/libs/mineagent-neoforge-$VERSION.jar"
          RELEASE_FLAGS=(--latest)
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$FABRIC_JAR" \
            "$NEOFORGE_JAR" \
            build/release-artifacts.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "MineAgent $GITHUB_REF_NAME" \
            --notes-file build/release-notes.md \
            --verify-tag \
            "${RELEASE_FLAGS[@]}"
