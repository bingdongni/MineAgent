name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  real-mods:
    uses: ./.github/workflows/modpack-tests.yml

  build:
    name: Java 21 / Fabric and NeoForge
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test native learning and build both loader artifacts
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon prepareReleaseNotes verifyReleaseArtifacts

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mineagent-test-evidence
          path: |
            fabric/build/gametest-results.xml
            fabric/build/test-results/test/*.xml
            fabric/build/reports/tests/test/
          if-no-files-found: warn

      - name: Upload Fabric artifact
        uses: actions/upload-artifact@v4
        with:
          name: mineagent-fabric
          path: fabric/build/libs/mineagent-fabric-*.jar
          if-no-files-found: error

      - name: Upload experimental NeoForge artifact
        uses: actions/upload-artifact@v4
        with:
          name: mineagent-neoforge-experimental
          path: neoforge/build/libs/mineagent-neoforge-*.jar
          if-no-files-found: error
