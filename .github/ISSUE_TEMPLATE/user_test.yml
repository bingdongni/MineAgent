name: User test feedback / 测试反馈
description: Record an independent first run, including successes and blockers / 记录真实上手结果
title: "[User test]: "
body:
  - type: markdown
    attributes:
      value: |
        Follow docs/getting-started.md or docs/getting-started.en.md in a separate test world. Report observed results, including unsuccessful steps. Do not include API keys, private addresses, complete configuration, memory or world saves. / 请使用独立测试世界，客观记录成功和失败，不要上传密钥、完整配置、记忆或存档。

  - type: input
    id: environment
    attributes:
      label: Versions and environment / 版本与环境
      placeholder: MineAgent 1.0.1, MC 1.21.1, Fabric Loader 0.20.1 + API 0.116.17, Java 21, single player, survival
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Installed mods / 模组列表
      description: List versions or start with only MineAgent and required dependencies.
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Protocol and model ID / 协议与模型
      description: Include official, relay or local service type. No keys or private endpoint URLs. Say "not configured" if you did not make model calls.
    validations:
      required: true

  - type: textarea
    id: stages
    attributes:
      label: First-run outcomes / 各步骤结果
      description: Mark each step passed, failed, or not attempted; do not infer success from a model's text alone.
      value: |
        Install and load / 安装加载:
        Open menu and create ONE companion / 菜单创建一个伙伴:
        Observe a small task's actual result / 核验小任务:
        Leave and rejoin, one restored companion / 退出重进恢复且不重复:
        Deliberately remove, rejoin without restoration / 移除后重进不恢复:
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: Task and actual result / 任务与实际结果
      description: Include the exact task, expected result, observed world/inventory changes, and reproducible blockers. Distinguish untested steps from failures.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence / 脱敏证据
      description: Optional short log excerpt or recording; include repeat runs and provider-reported usage only if actually observed. Never attach entire saves or configuration.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / 隐私
      options:
        - label: I checked attachments and removed credentials and private context / 已移除凭证和私人上下文
          required: true
